<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Gia the Great's Art World 👑🐾</title>
<style>
:root {
  --bg: #fdf5f9;
  --bar: #ffffff;
  --acc: #ff4d88;
  --soft: #ffe4ee;
  --txt: #3c3242;
}
* {
  box-sizing: border-box;
  margin: 0; padding: 0;
  -webkit-tap-highlight-color: transparent;
}
html, body {
  position: fixed;
  inset: 0;
  width: 100%; height: 100%;
  height: 100dvh;
  overflow: hidden;
  background: var(--bg);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  color: var(--txt);
  display: flex;
  flex-direction: column;
}
header {
  flex: 0 0 50px;
  background: var(--bar);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 10px;
  border-bottom: 2px solid var(--soft);
  gap: 5px;
  z-index: 20;
}
.brand {
  font-weight: 800;
  font-size: 1rem;
  color: var(--acc);
  white-space: nowrap;
}
.hdr-btns {
  display: flex;
  align-items: center;
  gap: 4px;
  overflow-x: auto;
  scrollbar-width: none;
}
.hdr-btns::-webkit-scrollbar { display: none; }
button {
  font-family: inherit;
  border: none;
  outline: none;
  cursor: pointer;
}
.btn-h {
  background: var(--soft);
  border: 1px solid rgba(255, 77, 136, 0.3);
  color: var(--txt);
  padding: 6px 8px;
  border-radius: 10px;
  font-size: 0.78rem;
  font-weight: 700;
  white-space: nowrap;
}
.btn-h:active, .btn-h.active {
  background: var(--acc);
  color: #fff;
}
#canvas-outer {
  flex: 1 1 0;
  min-height: 0;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 4px 6px;
  overflow: hidden;
}
#canvas-wrap {
  position: relative;
  background: #fff;
  border-radius: 18px;
  border: 3px solid var(--soft);
  overflow: hidden;
  box-shadow: 0 4px 14px rgba(255, 77, 136, 0.12);
  width: 100%;
  height: 100%;
}
#canvas-wrap.square {
  width: min(calc(100vw - 16px), calc(100dvh - 160px));
  height: min(calc(100vw - 16px), calc(100dvh - 160px));
  aspect-ratio: 1 / 1;
}
#cv, #guide {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  display: block;
}
#cv { touch-action: none; cursor: crosshair; }
#guide { pointer-events: none; display: none; z-index: 5; }
footer {
  flex: 0 0 auto;
  background: var(--bar);
  padding: 6px 8px max(8px, env(safe-area-inset-bottom, 10px));
  display: flex;
  flex-direction: column;
  gap: 6px;
  border-top: 2px solid var(--soft);
  z-index: 20;
}
.row {
  display: flex;
  align-items: center;
  gap: 5px;
  overflow-x: auto;
  scrollbar-width: none;
  padding: 2px 0;
}
.row::-webkit-scrollbar { display: none; }
.tool-btn {
  flex: 0 0 auto;
  padding: 6px 10px;
  border-radius: 12px;
  background: #f7f5f9;
  border: 2px solid #eae5ee;
  font-size: 0.8rem;
  font-weight: 700;
  color: var(--txt);
}
.tool-btn.active {
  background: var(--acc);
  border-color: var(--acc);
  color: #fff;
}
.sz-btn {
  flex: 0 0 auto;
  width: 32px; height: 32px;
  border-radius: 10px;
  background: #f5f2f7;
  border: 2px solid #e4dfe9;
  font-weight: 800;
  font-size: 0.78rem;
  display: flex; align-items: center; justify-content: center;
}
.sz-btn.active {
  border-color: var(--acc);
  background: var(--soft);
  color: var(--acc);
}
.swatch {
  flex: 0 0 auto;
  width: 30px; height: 30px;
  border-radius: 50%;
  border: 2px solid #fff;
  box-shadow: 0 2px 5px rgba(0,0,0,0.2);
  cursor: pointer;
}
.swatch.active {
  transform: scale(1.22);
  border-color: #2b2230;
}
.picker-btn {
  flex: 0 0 auto;
  position: relative;
  width: 30px; height: 30px;
  border-radius: 50%;
  overflow: hidden;
  background: conic-gradient(red, yellow, lime, aqua, blue, magenta, red);
  border: 2px solid #fff;
  box-shadow: 0 2px 5px rgba(0,0,0,0.18);
}
.picker-btn input {
  position: absolute;
  top: -10px; left: -10px;
  width: 50px; height: 50px;
  opacity: 0;
  cursor: pointer;
}
.stamp-btn {
  flex: 0 0 auto;
  font-size: 1.4rem;
  padding: 2px 6px;
  border-radius: 10px;
  background: #faf6fc;
}
.stamp-btn.active {
  background: var(--soft);
  border: 2px solid var(--acc);
}
.modal {
  position: fixed; inset: 0;
  background: rgba(30, 10, 35, 0.55);
  display: none; align-items: center; justify-content: center;
  z-index: 100; padding: 14px;
}
.modal-box {
  background: #fff;
  border-radius: 20px;
  padding: 16px;
  max-width: 400px; width: 100%;
  max-height: 85vh; overflow-y: auto;
  display: flex; flex-direction: column; gap: 10px;
}
.modal-head {
  display: flex; justify-content: space-between; align-items: center;
  font-weight: 800; color: var(--acc); font-size: 1.05rem;
  border-bottom: 2px solid var(--soft); padding-bottom: 6px;
}
.inp {
  width: 100%; padding: 8px 10px; border-radius: 10px;
  border: 2px solid #e5dfe9; font-weight: 600;
}
.grid2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.card {
  border: 2px solid #e5dfe9; border-radius: 12px;
  padding: 8px; text-align: center; background: #fbf9fd;
  font-weight: 800; font-size: 0.8rem;
}
.card:active { border-color: var(--acc); background: var(--soft); }
.submit {
  background: var(--acc); color: #fff;
  padding: 10px; border-radius: 12px;
  font-weight: 800; font-size: 0.92rem;
}
</style>
</head>
<body>

<script>
let soundOn = true, aCtx = null;
function playTone(freq = 560, dur = 0.18, sweep = 1.3) {
  if (!soundOn) return;
  try {
    if (!aCtx) aCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (aCtx.state === 'suspended') aCtx.resume();
    const osc = aCtx.createOscillator(), gain = aCtx.createGain(), t = aCtx.currentTime;
    osc.frequency.setValueAtTime(freq, t);
    osc.frequency.exponentialRampToValueAtTime(freq * sweep, t + dur * 0.4);
    osc.frequency.exponentialRampToValueAtTime(freq * 0.9, t + dur);
    gain.gain.setValueAtTime(0.15, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
    osc.connect(gain); gain.connect(aCtx.destination);
    osc.start(t); osc.stop(t + dur);
  } catch(e) {}
}

const state = {
  tool: 'brush',
  color: '#ff4d88',
  bgColor: '#ffffff',
  size: 14,
  stamp: '🐾',
  mandala: 0,
  hue: 0,
  drawing: false,
  x: 0, y: 0
};

const wrap = document.getElementById('canvas-wrap');
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d', { willReadFrequently: true });
const gcv = document.getElementById('guide');
const gctx = gcv.getContext('2d');

const undoList = [], redoList = [];
function saveState() {
  if (undoList.length >= 25) undoList.shift();
  undoList.push(ctx.getImageData(0, 0, cv.width, cv.height));
  redoList.length = 0;
}

function syncSize(keep = true) {
  const r = wrap.getBoundingClientRect();
  const w = Math.max(80, Math.floor(r.width));
  const h = Math.max(80, Math.floor(r.height));

  let temp = null;
  if (keep && cv.width > 0 && cv.height > 0) {
    temp = document.createElement('canvas');
    temp.width = cv.width; temp.height = cv.height;
    temp.getContext('2d').drawImage(cv, 0, 0);
  }

  cv.width = w; cv.height = h;
  gcv.width = w; gcv.height = h;

  ctx.fillStyle = state.bgColor;
  ctx.fillRect(0, 0, w, h);

  if (temp) {
    const scale = Math.min(w / temp.width, h / temp.height);
    const dw = temp.width * scale;
    const dh = temp.height * scale;
    const dx = (w - dw) / 2;
    const dy = (h - dh) / 2;
    ctx.drawImage(temp, dx, dy, dw, dh);
  }
  saveState();
  drawGuides();
}

syncSize(false);
window.addEventListener('resize', () => syncSize(true));
setTimeout(() => syncSize(true), 100);

function getPos(e) {
  const r = cv.getBoundingClientRect();
  const cx = (e.touches && e.touches[0]) ? e.touches[0].clientX : e.clientX;
  const cy = (e.touches && e.touches[0]) ? e.touches[0].clientY : e.clientY;
  return { x: cx - r.left, y: cy - r.top };
}

function getSymPoints(x, y) {
  if (!state.mandala) return [{x, y}];
  const cx = cv.width / 2, cy = cv.height / 2, pts = [];
  if (state.mandala === 2) {
    pts.push({x, y}, {x: 2 * cx - x, y});
  } else {
    const dx = x - cx, dy = y - cy, rad = Math.hypot(dx, dy), ang = Math.atan2(dy, dx);
    for (let i = 0; i < state.mandala; i++) {
      const step = (2 * Math.PI / state.mandala) * i;
      pts.push({x: cx + rad * Math.cos(ang + step), y: cy + rad * Math.sin(ang + step)});
      pts.push({x: cx + rad * Math.cos(-ang + step), y: cy + rad * Math.sin(-ang + step)});
    }
  }
  return pts;
}

function onDown(x, y) {
  state.drawing = true;
  state.x = x; state.y = y;
  const pts = getSymPoints(x, y);
  if (state.tool === 'stamp') {
    pts.forEach(p => drawStamp(p.x, p.y));
    saveState();
  } else {
    pts.forEach(p => drawDot(p.x, p.y));
  }
  playTone(state.tool === 'sparkle' ? 840 : 540);
}

function onDrag(x, y) {
  if (!state.drawing) return;
  if (state.tool === 'stamp') {
    if (Math.hypot(x - state.x, y - state.y) > state.size * 2) {
      getSymPoints(x, y).forEach(p => drawStamp(p.x, p.y));
      state.x = x; state.y = y;
    }
  } else {
    const p1 = getSymPoints(state.x, state.y);
    const p2 = getSymPoints(x, y);
    for (let i = 0; i < p1.length; i++) {
      drawLine(p1[i].x, p1[i].y, p2[i].x, p2[i].y);
    }
    state.x = x; state.y = y;
  }
}

function onUp() {
  if (state.drawing && state.tool !== 'stamp') saveState();
  state.drawing = false;
}

function drawDot(x, y) {
  ctx.save();
  const rad = Math.max(1, state.size / 2);
  ctx.fillStyle = state.tool === 'eraser' ? state.bgColor : (state.tool === 'rainbow' ? `hsl(${state.hue},95%,58%)` : state.color);
  if (state.tool === 'neon') {
    ctx.shadowColor = state.color; ctx.shadowBlur = state.size * 1.5; ctx.fillStyle = '#fff';
  }
  ctx.beginPath(); ctx.arc(x, y, rad, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function drawLine(x1, y1, x2, y2) {
  ctx.save();
  if (state.tool === 'eraser') {
    ctx.lineCap = 'round'; ctx.lineWidth = state.size * 1.5; ctx.strokeStyle = state.bgColor;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  } else if (state.tool === 'rainbow') {
    state.hue = (state.hue + 4) % 360;
    ctx.lineCap = 'round'; ctx.lineWidth = state.size; ctx.strokeStyle = `hsl(${state.hue},95%,58%)`;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  } else if (state.tool === 'neon') {
    ctx.lineCap = 'round'; ctx.lineWidth = state.size; ctx.strokeStyle = '#fff';
    ctx.shadowColor = state.color; ctx.shadowBlur = state.size * 1.6;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  } else if (state.tool === 'spray') {
    ctx.fillStyle = state.color;
    for (let i = 0; i < Math.max(6, state.size); i++) {
      const a = Math.random() * Math.PI * 2, r = Math.random() * state.size * 1.2;
      ctx.beginPath(); ctx.arc(x2 + r * Math.cos(a), y2 + r * Math.sin(a), 1.5, 0, Math.PI * 2); ctx.fill();
    }
  } else if (state.tool === 'sparkle') {
    ctx.lineCap = 'round'; ctx.lineWidth = Math.max(2, state.size * 0.45); ctx.strokeStyle = state.color;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    if (Math.random() < 0.3) {
      ctx.font = `${Math.max(14, state.size)}px sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('✨', x2 + (Math.random() - 0.5) * state.size * 1.6, y2 + (Math.random() - 0.5) * state.size * 1.6);
    }
  } else if (state.tool === 'ribbon') {
    const off = state.size * 0.6; ctx.fillStyle = state.color; ctx.beginPath();
    ctx.moveTo(x1 - off, y1 + off); ctx.lineTo(x2 - off, y2 + off);
    ctx.lineTo(x2 + off, y2 - off); ctx.lineTo(x1 + off, y1 - off);
    ctx.closePath(); ctx.fill();
  } else {
    ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.lineWidth = state.size; ctx.strokeStyle = state.color;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  }
  ctx.restore();
}

function drawStamp(x, y) {
  ctx.save();
  ctx.font = `${Math.max(24, state.size * 2)}px sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(state.stamp, x, y);
  ctx.restore();
}

cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  try { cv.setPointerCapture(e.pointerId); } catch(_) {}
  const p = getPos(e); onDown(p.x, p.y);
});
cv.addEventListener('pointermove', e => {
  e.preventDefault();
  const p = getPos(e); onDrag(p.x, p.y);
});
cv.addEventListener('pointerup', e => { e.preventDefault(); onUp(); });
cv.addEventListener('pointercancel', onUp);

function drawGuides() {
  gctx.clearRect(0, 0, gcv.width, gcv.height);
  if (!state.mandala) { gcv.style.display = 'none'; return; }
  gcv.style.display = 'block';
  gctx.strokeStyle = 'rgba(255, 77, 136, 0.4)'; gctx.lineWidth = 1.5; gctx.setLineDash([5, 5]);
  const cx = gcv.width / 2, cy = gcv.height / 2;
  if (state.mandala === 2) {
    gctx.beginPath(); gctx.moveTo(cx, 0); gctx.lineTo(cx, gcv.height); gctx.stroke();
  } else {
    const rad = Math.hypot(cx, cy);
    for (let i = 0; i < state.mandala; i++) {
      const a = (Math.PI / state.mandala) * i;
      gctx.beginPath(); gctx.moveTo(cx - rad * Math.cos(a), cy - rad * Math.sin(a));
      gctx.lineTo(cx + rad * Math.cos(a), cy + rad * Math.sin(a)); gctx.stroke();
    }
  }
  gctx.setLineDash([]);
}

function setTool(t, btn) {
  document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  state.tool = t;

  document.getElementById('color-row').style.display = (t === 'stamp' || t === 'bg') ? 'none' : 'flex';
  document.getElementById('stamp-row').style.display = (t === 'stamp') ? 'flex' : 'none';
  document.getElementById('bg-row').style.display = (t === 'bg') ? 'flex' : 'none';

  playTone(580);
}

function setSize(s, btn) {
  document.querySelectorAll('.sz-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  state.size = s;
  playTone(440);
}

function setColor(c, btn) {
  state.color = c;
  document.querySelectorAll('#color-row .swatch').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  playTone(520);
}

function setStamp(st, btn) {
  state.stamp = st;
  document.querySelectorAll('.stamp-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  playTone(620);
}

function setBg(c, btn) {
  state.bgColor = c;
  document.querySelectorAll('#bg-row .swatch').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  ctx.fillStyle = c;
  ctx.fillRect(0, 0, cv.width, cv.height);
  saveState();
  playTone(480);
}

function doUndo() {
  if (undoList.length > 1) {
    redoList.push(undoList.pop());
    ctx.putImageData(undoList[undoList.length - 1], 0, 0);
    playTone(460);
  }
}

function doRedo() {
  if (redoList.length > 0) {
    const s = redoList.pop();
    undoList.push(s);
    ctx.putImageData(s, 0, 0);
    playTone(620);
  }
}

const mandalaList = [
  {n: 0, l: '🪞 Mandala: Off'},
  {n: 2, l: '🪞 2-Way Mirror'},
  {n: 4, l: '🌸 4-Way Quad'},
  {n: 8, l: '✨ 8-Way Mandala'},
  {n: 12, l: '👑 12-Way Royal'}
];
let mIdx = 0;
function cycleMandala(btn) {
  mIdx = (mIdx + 1) % mandalaList.length;
  state.mandala = mandalaList[mIdx].n;
  btn.textContent = mandalaList[mIdx].l;
  btn.classList.toggle('active', state.mandala > 0);
  drawGuides();
  playTone(state.mandala ? 720 : 380);
}

function toggleSound(btn) {
  soundOn = !soundOn;
  btn.textContent = soundOn ? '🔊' : '🔇';
}

function clearCanvas() {
  ctx.fillStyle = state.bgColor;
  ctx.fillRect(0, 0, cv.width, cv.height);
  saveState();
  playTone(340);
}

function saveImage() {
  playTone(780);
  const a = document.createElement('a');
  a.download = `gia-art-${Date.now()}.png`;
  a.href = cv.toDataURL();
  a.click();
}

function openModal(id) {
  document.getElementById(id).style.display = 'flex';
  if (id === 'mod-meme') renderMeme();
  playTone(600);
}
function closeModal(id) {
  document.getElementById(id).style.display = 'none';
  playTone(400);
}

function loadPage(type) {
  closeModal('mod-pages');
  ctx.fillStyle = state.bgColor;
  ctx.fillRect(0, 0, cv.width, cv.height);

  const cx = cv.width / 2, cy = cv.height / 2;
  const s = Math.min(cv.width, cv.height) * 0.35;
  ctx.save();
  ctx.strokeStyle = '#2b2130'; ctx.lineWidth = 4; ctx.fillStyle = '#fff'; ctx.lineCap = 'round';

  function drawHead(ox, oy, sz) {
    ctx.beginPath(); ctx.ellipse(ox, oy, sz, sz * 0.85, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(ox - sz * 0.7, oy - sz * 0.4); ctx.lineTo(ox - sz * 0.6, oy - sz * 1.1); ctx.lineTo(ox - sz * 0.2, oy - sz * 0.7); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(ox + sz * 0.7, oy - sz * 0.4); ctx.lineTo(ox + sz * 0.6, oy - sz * 1.1); ctx.lineTo(ox + sz * 0.2, oy - sz * 0.7); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(ox - sz * 0.35, oy, sz * 0.12, 0, Math.PI * 2); ctx.arc(ox + sz * 0.35, oy, sz * 0.12, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(ox, oy + sz * 0.15); ctx.quadraticCurveTo(ox - 15, oy + sz * 0.35, ox - 25, oy + sz * 0.25);
    ctx.moveTo(ox, oy + sz * 0.15); ctx.quadraticCurveTo(ox + 15, oy + sz * 0.35, ox + 25, oy + sz * 0.25); ctx.stroke();
  }

  if (type === 'princess') {
    drawHead(cx, cy, s);
    ctx.beginPath(); ctx.moveTo(cx - 30, cy - s * 0.7); ctx.lineTo(cx - 25, cy - s * 1.15); ctx.lineTo(cx, cy - s * 0.9); ctx.lineTo(cx + 25, cy - s * 1.15); ctx.lineTo(cx + 30, cy - s * 0.7); ctx.closePath(); ctx.stroke();
    for (let i = -3; i <= 3; i++) { ctx.beginPath(); ctx.arc(cx + i * 20, cy + s * 0.8, 6, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); }
  } else if (type === 'astro') {
    ctx.beginPath(); ctx.arc(cx, cy, s * 1.1, 0, Math.PI * 2); ctx.stroke();
    drawHead(cx, cy + 10, s * 0.7);
    ctx.beginPath(); ctx.arc(cx + s * 1.2, cy - s * 0.8, 25, 0, Math.PI * 2); ctx.stroke();
  } else if (type === 'cupcake') {
    ctx.beginPath(); ctx.moveTo(cx - s * 0.6, cy + s * 0.2); ctx.lineTo(cx - s * 0.4, cy + s * 0.9); ctx.lineTo(cx + s * 0.4, cy + s * 0.9); ctx.lineTo(cx + s * 0.6, cy + s * 0.2); ctx.closePath(); ctx.stroke();
    drawHead(cx, cy - 10, s * 0.7);
    ctx.beginPath(); ctx.arc(cx, cy - s * 0.75, 16, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  } else if (type === 'fishbowl') {
    ctx.beginPath(); ctx.arc(cx + s * 0.2, cy + 10, s * 0.7, 0, Math.PI * 2); ctx.stroke();
    drawHead(cx - s * 0.6, cy, s * 0.55);
    ctx.beginPath(); ctx.ellipse(cx + s * 0.2, cy + 10, 18, 10, 0, 0, Math.PI * 2); ctx.stroke();
  } else if (type === 'yarn') {
    drawHead(cx - s * 0.3, cy - 10, s * 0.6);
    ctx.beginPath(); ctx.arc(cx + s * 0.4, cy + s * 0.2, s * 0.4, 0, Math.PI * 2); ctx.stroke();
  } else {
    ctx.beginPath(); ctx.arc(cx, cy, s * 1.1, 0, Math.PI * 2); ctx.stroke();
    for (let i = 0; i < 8; i++) {
      const a = (Math.PI / 4) * i;
      ctx.beginPath(); ctx.arc(cx + s * 0.6 * Math.cos(a), cy + s * 0.6 * Math.sin(a), s * 0.3, 0, Math.PI * 2); ctx.stroke();
    }
    drawHead(cx, cy, s * 0.35);
  }

  ctx.restore();
  saveState();
  playTone(640);
}

let currentAvatar = '😾';
const mcv = document.getElementById('m-cv'), mctx = mcv.getContext('2d');
const mTop = document.getElementById('m-top'), mBot = document.getElementById('m-bot');

function setMemeAvatar(av, btn) {
  document.querySelectorAll('#mod-meme .sz-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentAvatar = av;
  renderMeme();
  playTone(520);
}

function quickMeme(t, b) {
  mTop.value = t; mBot.value = b;
  renderMeme();
  playTone(600);
}

function renderMeme() {
  const w = mcv.width, h = mcv.height;
  mctx.fillStyle = '#ffedf2'; mctx.fillRect(0, 0, w, h);
  if (currentAvatar === 'canvas') {
    mctx.drawImage(cv, 0, 0, w, h);
  } else {
    mctx.font = '70px sans-serif';
    mctx.textAlign = 'center'; mctx.textBaseline = 'middle';
    mctx.fillText(currentAvatar, w / 2, h / 2);
  }
  function drawMemeText(txt, y) {
    if (!txt) return;
    mctx.save();
    mctx.font = '900 22px Impact, sans-serif';
    mctx.textAlign = 'center';
    mctx.fillStyle = '#fff'; mctx.strokeStyle = '#000'; mctx.lineWidth = 4;
    mctx.strokeText(txt.toUpperCase(), w / 2, y, w - 20);
    mctx.fillText(txt.toUpperCase(), w / 2, y, w - 20);
    mctx.restore();
  }
  drawMemeText(mTop.value, 28);
  drawMemeText(mBot.value, h - 12);
}

function applyMeme() {
  closeModal('mod-meme');
  const scale = Math.min(cv.width / mcv.width, cv.height / mcv.height);
  const dw = mcv.width * scale;
  const dh = mcv.height * scale;
  const dx = (cv.width - dw) / 2;
  const dy = (cv.height - dh) / 2;

  ctx.fillStyle = state.bgColor;
  ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.drawImage(mcv, dx, dy, dw, dh);
  saveState();
  playTone(700);
}

let isSquare = false;
function toggleCanvasShape(btn) {
  isSquare = !isSquare;
  wrap.classList.toggle('square', isSquare);
  btn.textContent = isSquare ? '📱 Standard' : '⏹️ Square';
  btn.classList.toggle('active', isSquare);
  setTimeout(() => syncSize(true), 40);
  playTone(isSquare ? 700 : 500);
}
</script>
